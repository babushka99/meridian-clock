<style>
  * { box-sizing: border-box; }
  body.light {
    --bg-void: #eef1f6; --bg-base: #f7f8fb; --bg-raised: #ffffff; --bg-elevated: #eef1f6; --bg-overlay: #ffffff;
    --fg-primary: #0f1522; --fg-secondary: #3a4560; --fg-tertiary: #5f6b85; --fg-muted: #8b95ad; --fg-inverse: #ffffff;
    --line-faint: #e3e7ef; --line-weak: #d3d9e5; --line-strong: #b7c0d2; --line-grid: #e9edf4;
    --accent-cyan: #0084b3; --accent-cyan-glow: rgba(0,132,179,.2); --glow-cyan: 0 0 6px rgba(0,132,179,.35);
    --accent-amber: #b86e00; --accent-amber-glow: rgba(184,110,0,.2); --accent-amber-dim: #d9a85e;
    --accent-green: #1d8a4a; --accent-green-glow: rgba(29,138,74,.2); --accent-blue: #2f5fd6; --accent-violet: #6d4fd1; --accent-violet-dim: #a894e6;
    --shadow-popover: 0 12px 32px rgba(15,21,34,.18), 0 2px 8px rgba(15,21,34,.1);
  }
  body.light .pill.live i { box-shadow: 0 0 8px var(--accent-green-glow); }
  body.light .cell.home { background: rgba(0,132,179,.07); }
  body.light .cell.gmt { background: rgba(95,107,133,.06); }
  body.light .band em { background: var(--accent-cyan); box-shadow: 0 0 6px rgba(0,132,179,.5); }
  body.light .city text { stroke: #f7f8fb; }
  body.light .legend .sw-night { background: #c9d2e3 !important; border-color: #aab5cb !important; }
  body.light .legend .sw-twi { background: linear-gradient(90deg,#c9d2e3,#e2cfa0,#f2d98a) !important; }
  body.light .legend .sw-day { background: #f2d98a !important; }
  body.light .legend .sw-sun { background: #5f6b85 !important; }
  body.light .legend .sw-now { background: #0084b3 !important; box-shadow: 0 0 6px #0084b3 !important; }
  html, body { margin: 0; height: 100%; background: var(--bg-void, #05070d); color: var(--fg-primary, #e6ecf7); font-family: var(--font-sans, 'Inter', sans-serif); overflow: hidden; }
  a { color: var(--accent-cyan); text-decoration: none; } a:hover { color: var(--fg-primary); }
  button { font: inherit; cursor: pointer; }
  input { font: inherit; color: inherit; } input::placeholder { color: var(--fg-muted); } input:focus { outline: none; border-color: var(--accent-cyan) !important; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .top { height: 44px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line-weak); background: var(--bg-base); }
  .top .l, .top .r { display: flex; align-items: center; gap: 12px; }
  .brand { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px 2px 7px; border-radius: 999px; border: 1px solid var(--line-weak); background: var(--bg-raised); font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .14em; }
  .pill i { width: 6px; height: 6px; border-radius: 50%; display: block; }
  .pill.live { color: var(--accent-green); } .pill.live i { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green-glow); }
  .pill.plan { color: var(--accent-amber); } .pill.plan i { background: var(--accent-amber); box-shadow: 0 0 8px var(--accent-amber-glow); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-tertiary); white-space: nowrap; }
  .brand { white-space: nowrap; }
  .top .l { min-width: 0; overflow: hidden; }
  @media (max-width: 1100px) { .meta .gd { display: none; } } .meta b { font-weight: 500; color: var(--fg-secondary); }
  .seg { display: inline-flex; border: 1px solid var(--line-weak); border-radius: 4px; overflow: hidden; background: var(--bg-raised); }
  .seg button { border: 0; height: 26px; padding: 0 10px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; background: transparent; color: var(--fg-tertiary); }
  .seg button + button { border-left: 1px solid var(--line-weak); }
  .seg button.on { background: var(--bg-elevated); color: var(--fg-primary); }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border: 1px solid var(--line-weak); border-radius: 4px; background: var(--bg-raised); color: var(--fg-secondary); font-size: 12px; font-weight: 500; }
  .btn:hover { background: var(--bg-elevated); color: var(--fg-primary); }
  .btn.icon { width: 28px; padding: 0; justify-content: center; color: var(--fg-tertiary); }
  .btn.primary { border-color: var(--accent-cyan); color: var(--accent-cyan); background: var(--bg-base); font-weight: 600; }
  .btn.primary:hover { background: var(--accent-cyan); color: var(--fg-inverse); }
  .btn.solid { border-color: var(--accent-cyan); background: var(--accent-cyan); color: var(--fg-inverse); font-weight: 600; }
  .btn.solid:hover { background: var(--fg-primary); border-color: var(--fg-primary); }
  .btn svg { width: 14px; height: 14px; }
  .plan-strip { height: 32px; flex: none; display: none; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line-weak); background: var(--bg-raised); font-family: var(--font-mono); font-size: 12px; }
  .plan-strip.show { display: flex; }
  .plan-strip .t { display: flex; align-items: center; gap: 10px; } .plan-strip .t .k { color: var(--accent-amber); font-weight: 600; letter-spacing: .08em; } .plan-strip .t .d { color: var(--fg-muted); } .plan-strip .t .w { color: var(--fg-tertiary); font-size: 11px; margin-left: 6px; }
  .map { flex: 1; position: relative; min-height: 0; background: var(--bg-base); }
  .map svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .city { cursor: pointer; }
  .city text { font-family: var(--font-sans); font-size: 10px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; fill: var(--fg-secondary); pointer-events: none; paint-order: stroke; stroke: #0a0f1c; stroke-width: 3px; stroke-linejoin: round; }
  .city.night text { fill: var(--fg-tertiary); }
  .city .time { font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: 0; text-transform: none; fill: var(--fg-tertiary); }
  .city:hover circle.dot { r: 4.5; }
  .city.home text { fill: var(--accent-cyan); }
  .city.minor text { font-size: 9px; font-weight: 500; fill: var(--fg-tertiary); }
  .city.minor:hover text { opacity: 1 !important; fill: var(--fg-primary); }
  .city:hover text { opacity: 1 !important; }
  .tip { position: absolute; z-index: 10; pointer-events: none; display: none; min-width: 190px; background: var(--bg-overlay); border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow-popover); padding: 10px 12px; }
  .tip.show { display: block; }
  .tip .n { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; gap: 12px; } .tip .n span { color: var(--fg-tertiary); font-weight: 400; }
  .tip .big { font-family: var(--font-mono); font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-top: 4px; line-height: 1.1; } .tip .big small { font-size: 11px; color: var(--fg-secondary); margin-left: 4px; }
  .tip .row { display: flex; justify-content: space-between; gap: 12px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); margin-top: 6px; } .tip .row b { font-weight: 500; color: var(--fg-secondary); }
  .tip .hint { margin-top: 8px; font-size: 10px; color: var(--fg-muted); }
  .editor { position: absolute; z-index: 20; display: none; width: 272px; background: var(--bg-elevated); border: 1px solid var(--line-strong); border-radius: 4px; box-shadow: var(--shadow-popover); padding: 14px; flex-direction: column; gap: 10px; }
  .editor.show { display: flex; }
  .editor .hd { display: flex; justify-content: space-between; align-items: center; } .editor .hd .k { font-family: var(--font-mono); font-size: 10px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-cyan); } .editor .hd .c { font-size: 12px; font-weight: 600; }
  .editor label { display: grid; grid-template-columns: 40px 1fr; align-items: center; gap: 8px; font-size: 11px; color: var(--fg-tertiary); }
  .editor .trow { display: grid; grid-template-columns: 40px 1fr auto; align-items: center; gap: 8px; font-size: 11px; color: var(--fg-tertiary); }
  .editor input { height: 28px; padding: 0 8px; border: 1px solid var(--line-strong); border-radius: 2px; background: var(--bg-base); color: var(--fg-primary); font-family: var(--font-mono); font-size: 12px; min-width: 0; color-scheme: dark; }
  .editor .note { font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); min-height: 12px; }
  .editor .acts { display: flex; justify-content: flex-end; gap: 8px; }
  .editor .ghost { height: 28px; padding: 0 12px; border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; color: var(--fg-secondary); font-size: 12px; } .editor .ghost:hover { background: var(--bg-overlay); color: var(--fg-primary); }
  .legend { position: absolute; left: 16px; right: 16px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-family: var(--font-mono); font-size: 10px; color: var(--fg-tertiary); pointer-events: none; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { display: block; width: 14px; height: 6px; border-radius: 2px; }
  .bar { flex: none; height: 64px; display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); border-top: 1px solid var(--line-weak); background: var(--bg-raised); }
  .cell { position: relative; display: flex; flex-direction: column; justify-content: center; gap: 2px; padding: 0 12px; border-left: 1px solid var(--line-faint); cursor: pointer; min-width: 0; }
  .cell:first-child { border-left: 0; }
  .cell:hover { background: var(--bg-elevated); }
  .cell.home { background: rgba(0,229,255,.045); box-shadow: inset 0 2px 0 var(--accent-cyan); }
  .cell.gmt { background: rgba(168,179,204,.04); box-shadow: inset 0 2px 0 var(--fg-tertiary); cursor: default; } .cell.gmt .r1 { color: var(--fg-tertiary); } .cell.gmt .band { background: none !important; } .cell.gmt .band i, .cell.gmt .band em { display: none; }
  .cell .r1 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--fg-secondary); white-space: nowrap; overflow: hidden; }
  .cell .r1 .diff { font-family: var(--font-mono); font-weight: 600; letter-spacing: 0; text-transform: none; }
  .cell .r2 { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; white-space: nowrap; min-width: 0; }
  .cell .r2 .dt { overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  @media (max-width: 1280px) { .bar { height: 76px; } .cell .r2 { flex-direction: column; align-items: flex-start; gap: 0; } .cell .r2 .tm { font-size: 14px; } }
  @media (max-width: 1100px) { .cell .r1 { font-size: 9px; letter-spacing: .04em; } .cell { padding: 0 8px; } .cell .r1 .diff { display: none; } .cell .r2 .dt .diff2 { display: inline; } }
  .cell .r2 .dt .diff2 { display: none; font-family: var(--font-mono); font-weight: 600; margin-left: 6px; }
  .cell .r2 .tm { font-family: var(--font-mono); font-size: 15px; font-weight: 500; letter-spacing: -.02em; color: var(--fg-primary); } .cell .r2 .tm small { font-size: 10px; color: var(--fg-secondary); margin-left: 3px; }
  .cell .r2 .dt { font-size: 10px; color: var(--fg-tertiary); font-variant-numeric: tabular-nums; }
  .cell .r2 .dt b { font-family: var(--font-mono); font-weight: 600; font-size: 9px; letter-spacing: .08em; border-radius: 999px; padding: 0 5px; margin-left: 4px; }
  .cell .r2 .dt b.prev { color: var(--accent-violet); border: 1px solid var(--accent-violet-dim); } .cell .r2 .dt b.next { color: var(--accent-amber); border: 1px solid var(--accent-amber-dim); }
  .band { position: relative; height: 4px; border-radius: 2px; margin-top: 3px; }
  .band i { position: absolute; top: -2px; width: 1px; height: 8px; background: var(--fg-secondary); }
  .band em { position: absolute; top: -3px; width: 2px; height: 10px; margin-left: -1px; background: var(--accent-cyan); box-shadow: var(--glow-cyan); }
  .foot { flex: none; height: 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 16px; border-top: 1px solid var(--line-faint); background: var(--bg-base); font-family: var(--font-mono); font-size: 10px; color: var(--fg-muted); }
  .foot span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; } .foot span:last-child { flex: 1; text-align: right; }
</style>
</head>

<div class="app">
  <div class="top">
    <div class="l">
      <span class="brand">World Time Ruler</span>
      <span class="pill live" id="pillLive"><i></i>LIVE</span>

      <button class="btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>Manage</button>

      <button class="btn icon" title="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg></button>
    </div>
  </div>
  <div class="plan-strip" id="planStrip">
    <div class="t"><span class="pill plan" style="padding:0;border:0;background:none"><i></i></span><span class="k">PLANNING</span><span class="d">·</span><span id="pCity"></span><span class="d">·</span><span id="pDate"></span><span class="d">·</span><span id="pTime"></span><span class="w" id="pWarn"></span></div>
    <button class="btn primary" id="backNow"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8M3 3v5h5"/></svg>Back to now</button>
  </div>
  <div class="map" id="map">
    <svg id="svg"></svg>
    <div class="tip" id="tip"></div>
    <div class="editor" id="editor">
      <div class="hd"><span class="k">Convert from</span><span class="c" id="edCity"></span></div>
      <label>Date <input id="edDate" placeholder="2026-10-07" spellcheck="false"></label>
      <div class="trow">Time <input id="edTime" placeholder="5:30"><div class="seg" id="ampm"><button data-v="AM">AM</button><button data-v="PM" class="on">PM</button></div></div>
      <div class="note" id="edNote"></div>
      <div class="acts"><button class="ghost" id="edCancel">Cancel</button><button class="btn solid" id="edApply">Apply</button></div>
    </div>
    <div class="legend">
      <span><i class="sw-day" style="background:#e8d49a"></i>Daylight</span>
      <span><i class="sw-twi" style="background:linear-gradient(90deg,#1c2742,#8a6f4a,#e8d49a)"></i>Twilight</span>
      <span><i class="sw-night" style="background:#1c2742;border:1px solid #35425f"></i>Night</span>
      <span><i class="sw-sun" style="width:1px;height:10px;background:#a8b3cc"></i>Sunrise / sunset</span>
      <span><i class="sw-now" style="width:2px;height:10px;background:#00e5ff;box-shadow:0 0 6px #00e5ff"></i>Local time</span>
      <span style="color:#4a5570">Hover a city for local time · click to convert</span>
    </div>
  </div>
  <div class="bar" id="bar"></div>
  <div class="foot"><span id="footL"></span><span id="sunMeta"></span><span>Solar geometry NOAA approx. · DST per IANA · Natural Earth 110m</span></div>
</div>

  state.planMeta = { city: city.name, date: `${MONL[lp.m - 1]} ${lp.d}, ${lp.y}`, time: fmtStr(lp.H * 60 + lp.M, state.is12),
    warn: !r.exists ? `Entered time does not exist in ${city.name} (DST gap) · shifted forward` : r.ambiguous ? 'Ambiguous during DST fall-back · first occurrence used' : '' };
  ed.classList.remove('show'); state.editor = null;
  updateMode(); render();
};
document.getElementById('edTime').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('edApply').click(); if (e.key === 'Escape') document.getElementById('edCancel').click(); });
mapEl.addEventListener('click', e => { if (!ed.contains(e.target) && ed.classList.contains('show')) document.getElementById('edCancel').click(); });

function updateMode() {
  const plan = state.mode === 'plan';
  document.getElementById('pillLive').style.display = plan ? 'none' : '';
  document.getElementById('pillPlan').style.display = plan ? '' : 'none';
  document.getElementById('planStrip').classList.toggle('show', plan);
  if (plan) { document.getElementById('pCity').textContent = state.planMeta.city; document.getElementById('pDate').textContent = state.planMeta.date; document.getElementById('pTime').textContent = state.planMeta.time; document.getElementById('pWarn').textContent = state.planMeta.warn; }
  requestAnimationFrame(layout);
}
document.getElementById('themeBtn').onclick = () => {
  const light = !document.body.classList.contains('light');
  document.body.classList.toggle('light', light);
  T = THEMES[light ? 'light' : 'dark']; NIGHT = T.NIGHT; TWI = T.TWI; GOLD = T.GOLD;
  localStorage.setItem('wtr-theme', light ? 'light' : 'dark');
  layout();
};
document.getElementById('backNow').onclick = () => { state.mode = 'live'; state.planUtc = null; state.planMeta = null; updateMode(); };
document.getElementById('b12').onclick = () => { state.is12 = true; document.getElementById('b12').classList.add('on'); document.getElementById('b24').classList.remove('on'); render(); };
document.getElementById('b24').onclick = () => { state.is12 = false; document.getElementById('b24').classList.add('on'); document.getElementById('b12').classList.remove('on'); render(); };

// ---- bottom bar ----
function renderBar(cities, utc) {
  cities = cities.filter(d => d.ruler);
  const gp = parts(utc, 'Etc/UTC'), gmin = gp.H * 60 + gp.M, hoff = offsetMin(utc, CITIES[state.homeIdx].tz);
  const hp = parts(utc, CITIES[state.homeIdx].tz), gDelta = (Date.UTC(gp.y, gp.m - 1, gp.d) - Date.UTC(hp.y, hp.m - 1, hp.d)) / DAY;
  const gmt = { idx: -1, name: 'GMT', country: 'UTC+0', tz: 'Etc/UTC', lat: 51.48, lon: 0, p: gp, off: 0, diff: -hoff, localMin: gmin, sol: solar(gp.y, gp.m, gp.d, 51.48, 0, 0), isDay: null, dayDelta: gDelta, isHome: false, ruler: true, gmt: true };
  gmt.isDay = gmin >= gmt.sol.rise && gmin < gmt.sol.set;
  cities = [...cities, gmt].sort((a, b) => a.off - b.off || a.idx - b.idx);
  document.getElementById('bar').innerHTML = cities.map(d => {
    const t = fmtMin(d.localMin, state.is12);
    return `<div class="cell${d.isHome ? ' home' : ''}${d.gmt ? ' gmt' : ''}" data-idx="${d.idx}">
      <div class="r1"><span style="overflow:hidden;text-overflow:ellipsis">${d.name}</span><span class="diff" style="color:${d.diff === 0 ? T.diffHome : d.diff < 0 ? T.diffNeg : T.diffPos}">${diffLabel(d.diff)}</span></div>
      <div class="r2"><span class="tm">${t.main}<small>${t.suffix}</small></span><span class="dt"><span class="wd">${d.p.wd}, </span>${MON[d.p.m - 1]} ${d.p.d}${d.dayDelta < 0 ? '<b class="prev">PREV</b>' : d.dayDelta > 0 ? '<b class="next">NEXT</b>' : ''}<span class="diff2" style="color:${d.diff === 0 ? T.diffHome : d.diff < 0 ? T.diffNeg : T.diffPos}">${diffLabel(d.diff)}</span></span></div>
      <div class="band" style="background:${gradient(d.sol.rise, d.sol.set)}"><i style="left:${pct(d.sol.rise)}"></i><i style="left:${pct(d.sol.set)}"></i><em style="left:${pct(d.localMin)}"></em></div>
    </div>`;
  }).join('');
  document.getElementById('footL').textContent = (state.mode === 'plan' ? 'Planning instant · ' : 'Live · ') + new Date(utc).toISOString().slice(0, 16).replace('T', ' ') + 'Z · ' + CITIES.length + ' cities on map · 10 + GMT on ruler · solar offsets ±15° per hour, ticks every 30 min';
}
document.getElementById('bar').addEventListener('click', e => { const c = e.target.closest('.cell:not(.gmt)'); if (c) openEditor(compute().find(d => d.idx === +c.dataset.idx)); });
document.getElementById('bar').addEventListener('mouseover', e => { const c = e.target.closest('.cell:not(.gmt)'); if (c) { const d = compute().find(x => x.idx === +c.dataset.idx); state.hover = d.idx; showTip(d); } });
document.getElementById('bar').addEventListener('mouseleave', () => { state.hover = null; hideTip(); });

// ---- boot ----
fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r => r.json()).then(topo => {
  land = topojson.feature(topo, topo.objects.countries);
  const boot = () => { if (!mapEl.clientWidth || !mapEl.clientHeight) return setTimeout(boot, 100); layout(); }; boot();
});
new ResizeObserver(() => layout()).observe(mapEl);
window.addEventListener('load', layout); window.addEventListener('resize', layout); document.addEventListener('visibilitychange', layout);
setInterval(() => { if (state.mode === 'live') render(); }, 15000);
</script>
</body>
</html>
